<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mechanic Activity Reports</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#1d2433;--mut:#6b7280;--bd:#d6dae1;--ac:#1a56db;--hd:#eef1f6}
@media(prefers-color-scheme:dark){:root{--bg:#161a22;--fg:#e6e9ef;--mut:#9aa3b2;--bd:#323a49;--ac:#6c9cff;--hd:#222936}}
*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif}
h1{font-size:19px;margin:0 0 12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
select,input[type=month],input[type=file]{width:100%;padding:6px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg)}
select[multiple]{height:84px}
.cb{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--fg);margin:4px 0}.cb input{width:auto}
button{padding:8px 16px;border:0;border-radius:6px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer;margin-right:8px}
button:disabled{opacity:.4;cursor:default}
#st,#note{color:var(--mut);margin:8px 0}
.w{overflow:auto;max-height:65vh;border:1px solid var(--bd);border-radius:6px}
table{border-collapse:collapse;width:100%}th,td{padding:5px 9px;border-bottom:1px solid var(--bd);white-space:nowrap;text-align:left}
th{position:sticky;top:0;background:var(--hd)}td.n{text-align:right}tr.f td{font-weight:700;background:var(--hd)}
.hide{display:none}
</style></head><body>
<h1>Mechanic Activity Reports</h1>
<div id="st">Loading data...</div>
<details id="manual" class="hide" style="margin-bottom:12px"><summary>Choose files manually</summary>
<div class="g"><div><label>Scan CSVs (select all quarter files)</label><input type="file" id="fScans" multiple accept=".csv"></div>
<div><label>Master CSV (optional)</label><input type="file" id="fMaster" accept=".csv"></div></div>
<button id="bLoad">Load files</button></details>

<div class="g">
 <div><label>Report</label><select id="rep">
  <option value="active">1. Active Mechanics (1+ coupon in a month)</option>
  <option value="active5">2. Active with 5 Scans (5+ in a month)</option>
  <option value="inactive">3. Inactive Mechanics (none in last 3 months)</option></select></div>
 <div><label>Period from</label><input type="month" id="from"></div>
 <div><label>Period to</label><input type="month" id="to"></div>
 <div><label>View</label><select id="view"><option value="month">Month-wise</option><option value="period">Period total</option></select></div>
 <div><label>Distributor (none selected = all)</label><select id="dist" multiple></select></div>
</div>
<div id="opt-inactive" class="hide">
 <div class="cb"><input type="checkbox" id="running"><label for="running" style="margin:0;color:inherit">Period end month is still running (exclude it; check the 3 months before it)</label></div>
 <div class="cb"><input type="checkbox" id="never"><label for="never" style="margin:0;color:inherit">Also list master users with no scans in the period</label></div>
</div>
<button id="go" disabled>Generate</button><button id="dl" disabled>Download Excel</button>
<div id="note"></div><div class="w"><table id="t"></table></div>

<script>
// ===== CORE (pure logic; no DOM) =====
const D={u:new Map(),months:new Set(),master:new Map()};
const norm=s=>String(s==null?'':s).trim().toUpperCase();
const p2=n=>String(n).padStart(2,'0');
function ymOf(s){s=String(s||'').trim();let m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);if(m)return m[3]+'-'+p2(m[2]);m=s.match(/^(\d{4})-(\d{2})/);return m?m[1]+'-'+m[2]:null}
function mshift(k,d){const[y,m]=k.split('-').map(Number),t=y*12+m-1+d;return Math.floor(t/12)+'-'+p2(t%12+1)}
function mrange(a,b){const o=[];for(let k=a;k<=b;k=mshift(k,1))o.push(k);return o}
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const mlabel=k=>MN[+k.slice(5)-1]+'-'+k.slice(0,4);
function addScan(r){
  const c=norm(r.WorkshopCode),m=ymOf(r.Date),n=parseFloat(r['#OfOilScans']);
  if(!c||!m||!(n>0))return;
  let u=D.u.get(c);if(!u){u={pm:{},dist:''};D.u.set(c,u)}
  u.pm[m]=(u.pm[m]||0)+n;if(r.DistributorName)u.dist=r.DistributorName.trim();D.months.add(m)}
function addMaster(r){
  const c=norm(r['Share Code']);
  if(!c||/^\d+(\.\d+)?E\+\d+$/.test(c)||D.master.has(c))return; // skip blank / Excel-damaged codes, first row wins
  D.master.set(c,{name:r.WorkshopName||'',type:r.WorkshopType||'',dsr:(r['DSR Name']||'').replace(/\s+/g,' ').trim(),dist:(r.DistributorName||'').trim(),mob:r['Mobile Number']||''})}
const info=(c,u)=>{const m=D.master.get(c)||{};return[c,m.name||'',m.type||'',m.dsr||'',m.dist||(u&&u.dist)||'',m.mob||'']};
const IH=['Workshop Code','Workshop Name','Workshop Type','DSR Name','Distributor','Mobile Number'];
const sum=(u,ms)=>ms.reduce((a,m)=>a+((u&&u.pm[m])||0),0);
const byDist=(a,b)=>String(a[4]).localeCompare(b[4])||String(a[0]).localeCompare(b[0]);

function build(o){ // o:{rep,from,to,view,running,never,dists:Set}
  if(!o.from||!o.to||o.from>o.to)throw new Error('Choose a valid period (From must not be after To).');
  const ms=mrange(o.from,o.to),ok=r=>!o.dists||!o.dists.size||o.dists.has(r[4]);
  const lab=ms.map(mlabel),span=mlabel(o.from)+(o.from===o.to?'':' to '+mlabel(o.to));
  let head,rows,foot=null,note='';
  const users=[...D.u.entries()];
  if(o.rep==='active'||o.rep==='active5'){
    const th=o.rep==='active5'?5:1,five=o.rep==='active5';
    if(five)o.view='month';
    if(o.view==='month'){
      head=[...IH,...lab,five?'Months with 5+ Scans':'Total Coupons'];
      rows=users.map(([c,u])=>{const v=ms.map(m=>u.pm[m]||0);
        if(!v.some(x=>x>=th))return null;
        const cells=five?v.map(x=>x>=5?x:''):v;
        return[...info(c,u),...cells,five?v.filter(x=>x>=5).length:v.reduce((a,b)=>a+b,0)]}).filter(r=>r&&ok(r)).sort(byDist);
      const k=IH.length;foot=['Active Users','','','','',''];
      ms.forEach((m,i)=>foot.push(rows.filter(r=>+r[k+i]>=th).length));foot.push(rows.length+' unique');
      note=`${five?'Active with 5 Scans':'Active Mechanics'} - month-wise, ${span}. ${rows.length} unique users.`;
    }else{
      head=[...IH,'Coupons Scanned ('+span+')'];
      rows=users.map(([c,u])=>({c,u,s:sum(u,ms)})).filter(x=>x.s>0).map(x=>[...info(x.c,x.u),x.s]).filter(ok)
        .sort((a,b)=>String(a[4]).localeCompare(b[4])||b[6]-a[6]);
      foot=['Total','','','','','',rows.reduce((a,r)=>a+r[6],0)];
      note=`Active Mechanics - period total, ${span}. ${rows.length} unique users.`;
    }
  }else{ // inactive
    const E=o.to,win=o.running?mrange(mshift(E,-3),mshift(E,-1)):mrange(mshift(E,-2),E);
    const cand=new Map(users);
    if(o.never)D.master.forEach((_,c)=>{if(!cand.has(c))cand.set(c,null)});
    head=[...IH,'Coupons in Period ('+span+')','Last Scan Month'];
    rows=[];
    cand.forEach((u,c)=>{
      const tot=sum(u,ms);if(!o.never&&tot<=0)return;
      if(sum(u,win)>0)return; // active in last 3 months -> not inactive
      const last=u?Object.keys(u.pm).filter(m=>m<=E&&u.pm[m]>0).sort().pop():null;
      rows.push([...info(c,u),tot,last?mlabel(last):'-'])});
    rows=rows.filter(ok).sort(byDist);
    foot=['Total','','','','','',rows.reduce((a,r)=>a+r[6],0),''];
    note=`Inactive Mechanics - no coupons in ${mlabel(win[0])} to ${mlabel(win[win.length-1])}; coupons shown for ${span}. ${rows.length} users.`;
  }
  return{head,rows,foot,note}}
// ===== /CORE =====

const $=id=>document.getElementById(id);let OUT=null;
const st=t=>$('st').textContent=t;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function parse(text,fn){return new Promise((res,rej)=>Papa.parse(text,{header:true,skipEmptyLines:true,transformHeader:h=>h.trim(),
  complete:r=>{r.data.forEach(fn);res()},error:rej}))}
const dec=(buf,enc)=>new TextDecoder(enc).decode(buf);
async function loadAll(scans,master){ // scans:[async()=>ArrayBuffer], master: async()=>ArrayBuffer|null
  D.u.clear();D.months.clear();D.master.clear();
  if(master){st('Reading master...');await parse(dec(await master(),'windows-1252'),addMaster)}
  for(let i=0;i<scans.length;i++){st(`Reading scan file ${i+1} of ${scans.length}...`);await parse(dec(await scans[i](),'utf-8'),addScan)}
  const ms=[...D.months].sort();if(!ms.length){st('No scan rows found.');return}
  $('from').value=ms[0];$('to').value=ms[ms.length-1];
  const ds=new Set();D.u.forEach((u,c)=>ds.add(info(c,u)[4]));
  $('dist').innerHTML=[...ds].filter(Boolean).sort().map(d=>`<option>${esc(d)}</option>`).join('');
  $('go').disabled=false;
  st(`Loaded ${D.u.size.toLocaleString()} users, ${mlabel(ms[0])} to ${mlabel(ms[ms.length-1])} (${D.master.size.toLocaleString()} master records).`)}
async function auto(){
  try{const man=await (await fetch('data/manifest.json',{cache:'no-cache'})).json();
    const get=f=>async()=>{const r=await fetch('data/'+f,{cache:'no-cache'});if(!r.ok)throw new Error(f);return r.arrayBuffer()};
    await loadAll(man.scans.map(get),man.master?get(man.master):null)}
  catch(e){st('Could not auto-load data/manifest.json. Choose the files manually.');$('manual').classList.remove('hide');$('manual').open=true}}
$('bLoad').onclick=async()=>{const s=[...$('fScans').files].sort((a,b)=>a.name.localeCompare(b.name));
  if(!s.length)return st('Select the scan CSV files first.');const m=$('fMaster').files[0];
  await loadAll(s.map(f=>()=>f.arrayBuffer()),m?()=>m.arrayBuffer():null)};
function ui(){const r=$('rep').value;$('opt-inactive').classList.toggle('hide',r!=='inactive');
  $('view').disabled=r!=='active';if(r==='active5')$('view').value='month';if(r==='inactive')$('view').value='period'}
$('rep').onchange=ui;ui();
$('go').onclick=()=>{try{
  OUT=build({rep:$('rep').value,from:$('from').value,to:$('to').value,view:$('view').value,running:$('running').checked,never:$('never').checked,
    dists:new Set([...$('dist').selectedOptions].map(o=>o.value))});
  const{head,rows,foot}=OUT,LIM=1000;
  $('note').textContent=OUT.note+(rows.length>LIM?` Showing first ${LIM}; Excel has all.`:'');
  $('t').innerHTML='<tr>'+head.map(h=>`<th>${esc(h)}</th>`).join('')+'</tr>'+
    rows.slice(0,LIM).map(r=>'<tr>'+r.map(v=>`<td${typeof v==='number'?' class="n"':''}>${esc(v)}</td>`).join('')+'</tr>').join('')+
    (foot?'<tr class="f">'+foot.map(v=>`<td${typeof v==='number'?' class="n"':''}>${esc(v)}</td>`).join('')+'</tr>':'');
  $('dl').disabled=false}catch(e){$('note').textContent=e.message}};
$('dl').onclick=()=>{if(!OUT)return;
  const ws=XLSX.utils.aoa_to_sheet([OUT.head,...OUT.rows,...(OUT.foot?[OUT.foot]:[])]);
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Report');
  XLSX.writeFile(wb,`${$('rep').value}_${$('from').value}_to_${$('to').value}.xlsx`)};
auto();
</script></body></html>
